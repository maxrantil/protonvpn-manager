name: Run Tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openvpn coreutils curl bc libnotify-bin wireguard-tools iproute2
          # Verify core utilities are available
          echo "PATH: $PATH"
          which realpath dirname chmod
          realpath --version
          dirname --version
          chmod --version

      - name: Debug hardening tests (temporary)
        run: |
          cd tests
          umask; id
          d=$(mktemp -d); mkdir "$d/s"; chmod 700 "$d/s"
          t=$(mktemp "$d/s/.x.XXXXXX"); echo "mktemp=$? $t"
          printf 'a\n' | install -m 600 /dev/stdin "$t"; echo "install=$?"
          mv -f -- "$t" "$d/s/rec"; echo "mv=$?"; ls -la "$d/s"
          bash unit/test_hardening.sh < /dev/null 2>&1 | grep -A12 -E "✗.*recorded next|Results" || true

      - name: Run all tests
        run: |
          cd tests
          ./run_tests.sh

      - name: Install VPN Manager
        run: |
          ./install.sh

      - name: Run smoke tests
        run: |
          ./tests/smoke/run_smoke_tests.sh

      - name: Cleanup test processes
        if: always()
        run: |
          # Kill any remaining sleep processes from tests
          pkill -f "sleep" || true
          # Ensure all background jobs are terminated
          jobs -p | xargs -r kill 2>/dev/null || true
          wait 2>/dev/null || true

      - name: Verify tests passed
        run: |
          echo "✅ All tests passed successfully"
          echo ""
          echo "Per CLAUDE.md Section 3: TDD is MANDATORY"
          echo "All features must have tests before merging"
